# ============================================================
#  tmux.conf  —  pentest / CPTS workflow
#  Install:  cp this file to  ~/.tmux.conf
#  Reload:   tmux source-file ~/.tmux.conf   (or prefix + r below)
# ============================================================

# ---- Prefix: Ctrl+a instead of Ctrl+b (easier reach) ----
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ---- Mouse: click panes, drag borders, wheel-scroll ----
set -g mouse on

# ---- Sane numbering: windows/panes start at 1, auto-renumber ----
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ---- Bigger scrollback buffer (default is only 2000) ----
set -g history-limit 50000

# ---- Faster key response (no escape-key delay in vim, etc.) ----
set -sg escape-time 10

# ---- Reload config with: prefix + r ----
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ---- Intuitive split keys: | vertical, - horizontal ----
#      (and open new panes/windows in the CURRENT directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
# keep the old % and " too
unbind '"'
unbind %

# ---- Move between panes with Alt+arrow (no prefix needed) ----
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# ---- Resize panes with prefix + H/J/K/L (repeatable) ----
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ---- vi-style keys in copy mode (scrollback) ----
setw -g mode-keys vi
bind v copy-mode                       # prefix + v  -> enter scroll/copy mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ---- Quick window switching: Shift+arrow (no prefix) ----
bind -n S-Left  previous-window
bind -n S-Right next-window

# ---- Status bar: clean, shows session + time ----
set -g status-interval 5
set -g status-style "bg=colour235,fg=colour250"
set -g status-left "#[bg=colour39,fg=colour16,bold] #S #[default] "
set -g status-left-length 30
set -g status-right "#[fg=colour245]%Y-%m-%d #[fg=colour250,bold]%H:%M "
setw -g window-status-current-style "bg=colour39,fg=colour16,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "

# ---- Highlight the active pane border ----
set -g pane-active-border-style "fg=colour39"
